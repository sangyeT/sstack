name: SStack quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sstack-quality-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Stack lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/sstack/requirements-dev.txt
      - run: python -m pip install -r tools/sstack/requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Verify affected projects
        env:
          SSTACK_REQUIRE_BROWSER: '1'
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_REVISION" || "$BASE_REVISION" =~ ^0+$ ]]; then
            python tools/sstack/control.py verify stack --jobs 2 --timeout 180
            python tools/sstack/control.py coverage --base "$GITHUB_SHA"
          else
            python tools/sstack/control.py verify changed --base "$BASE_REVISION" --jobs 2 --timeout 180
          fi
