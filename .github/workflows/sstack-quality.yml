name: SStack quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Stack lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r tools/sstack/requirements-dev.txt
      - run: python -m ruff check --config tools/sstack/ruff.toml install.py
      - run: python -m ruff format --check --config tools/sstack/ruff.toml install.py
      - run: python tools/sstack/lint.py
      - run: python tools/sstack/control.py verify stack
      - name: Require project coverage for changed paths
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          if [[ "$BASE_REVISION" =~ ^0+$ ]]; then
            BASE_REVISION="$GITHUB_SHA"
          fi
          python tools/sstack/control.py coverage --base "$BASE_REVISION"
